{%- assign t = site.data.i18n[page.lang] -%}
<footer class="site-footer">
  <div class="shell site-footer__inner">
    <p class="site-footer__id">
      <span>{{ t.author_name }}</span>
      <span class="muted">{{ t.tagline }}</span>
    </p>

    <nav class="site-footer__links" aria-label="{% if page.lang == 'en' %}Contacts and subscription{% else %}Контакты и подписка{% endif %}">
      {%- for link in site.data.social %}
      <a href="{{ link.url }}"{% unless link.url contains 'mailto:' %} rel="me noopener"{% endunless %}>{{ link.name }}</a>
      {%- endfor %}
      {%- if page.lang == "ru" -%}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      {%- endif -%}
    </nav>

    <p class="site-footer__meta muted">© {{ 'now' | date: "%Y" }} — {{ t.footer.built_with }}</p>
  </div>
</footer>
