<header class="site-header">
  <div class="shell site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>
      <span class="wordmark__name">{{ site.author.name }}</span>
      <span class="wordmark__domain">kzuev.com</span>
    </a>

    <nav class="site-nav" aria-label="Основная навигация">
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}aria-current="page"{% endif %}>Проекты</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}aria-current="page"{% endif %}>Записи</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>Обо мне</a>
      <a href="{{ '/contacts/' | relative_url }}" {% if page.url contains '/contacts' %}aria-current="page"{% endif %}>Контакты</a>
    </nav>
  </div>
</header>
