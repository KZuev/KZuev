{%- if include.lang == "en" -%}
<time class="date" datetime="{{ include.date | date_to_xmlschema }}">{{ include.date | date: "%B %-d, %Y" }}</time>
{%- else -%}
{%- assign month_index = include.date | date: "%-m" | minus: 1 -%}
<time class="date" datetime="{{ include.date | date_to_xmlschema }}">{{ include.date | date: "%-d" }} {{ site.data.ru.months[month_index] }} {{ include.date | date: "%Y" }}</time>
{%- endif -%}
