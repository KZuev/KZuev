name: Telegram → заметки

# Раз в час проверяет канал и публикует новые посты как заметки на сайте.
# Коммитит прямо в gh-pages — по условию, если пост уже опубликован в
# канале, дополнительная проверка перед публикацией на сайте не нужна.
#
# Настройка (один раз):
#   1. Создать бота через @BotFather, получить токен.
#   2. Добавить бота администратором в канал (иначе он не увидит посты).
#   3. Узнать chat id канала (например, переслать любое сообщение из
#      канала боту @getidsbot) — это отрицательное число вида -100…
#   4. В Settings → Secrets and variables → Actions добавить:
#        TELEGRAM_BOT_TOKEN
#        TELEGRAM_CHANNEL_ID

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Забрать новые посты из канала
        id: ingest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node .github/scripts/telegram-ingest.mjs

      - name: Закоммитить и запушить
        if: steps.ingest.outputs.has_new_posts == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts .github/telegram-state.json
          git commit -m "Заметка(и) из Telegram-канала"
          git push origin gh-pages
