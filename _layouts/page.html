---
layout: default
---
<article class="shell prose">
  <header class="page-head">
    {%- if page.avatar %}
    <img class="avatar" src="{{ page.avatar | relative_url }}" alt="{{ page.avatar_alt | default: page.title }}" width="96" height="96" loading="lazy">
    {%- endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.lead %}
    <p class="lead">{{ page.lead }}</p>
    {%- endif %}
  </header>

  <div class="prose__body">
    {{ content }}
  </div>
</article>
