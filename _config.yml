# --- Идентичность сайта -------------------------------------------------
title: KZuev.com
tagline: ИТ-проекты, эксперименты и заметки о разработке
description: >-
  Персональный сайт Кирилла Зуева: ИТ-проекты с открытым исходным кодом,
  эксперименты и заметки о разработке.
# Хешем, а не строкой: иначе jekyll-seo-tag подставляет имя автора
# в twitter:creator вместо ника.
author:
  name: Кирилл Зуев
  twitter: kzuev
email: mail@kzuev.com

# Абсолютный адрес обязателен: из него собираются canonical, og:url,
# идентификаторы записей в feed.xml и sitemap.xml.
url: "https://kzuev.com"
baseurl: ""

lang: ru
locale: ru_RU
timezone: Europe/Moscow

twitter:
  username: kzuev
  card: summary_large_image
github_username: kzuev

# --- Адреса -------------------------------------------------------------
# Категории намеренно не участвуют в permalink: кириллица в них
# превращала адреса постов в процентное кодирование.
permalink: /blog/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
    values:
      layout: page
      # jekyll-seo-tag берёт image только из front matter страницы,
      # поэтому картинку для превью раздаём через defaults.
      # Отдельной странице её можно переопределить в front matter.
      image: /assets/og.png

# --- Сборка -------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: feed.xml

# Служебный redirects.json на сайте не нужен.
redirect_from:
  json: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .github
